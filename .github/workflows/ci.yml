name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Postgres 17 + pgvector, so the tests that use the throwaway database
    # (migrations, account linking, Google Tasks) run instead of being skipped.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: command_center
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Dummy values only: no test calls Anthropic or Google, and there is no .env in CI.
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/command_center
      ANTHROPIC_API_KEY: test-key-not-used
      SESSION_SECRET: ci-session-secret
      TOKEN_ENCRYPTION_KEY: ZmFrZS1jaS1rZXktZm9yLXRlc3RzLW9ubHktMDAwMDA=
      BACKGROUND_SYNC_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -rs

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build
