[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AbdulMominAlam", email = "202409577+AbdulMominAlam@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=0.125.0",
    "apscheduler>=3.11.3",
    "cryptography>=50.0.2",
    "fastapi>=0.128.8",
    "google-api-python-client>=2.201.0",
    "google-auth>=2.59.1",
    "google-auth-oauthlib>=1.5.0",
    "httpx>=0.28.1",
    "icalendar>=7.3.0",
    "itsdangerous>=2.2.0",
    "ollama>=0.6.3",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.1",
    "sqlalchemy>=2.1.1",
    "uvicorn[standard]>=0.39.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
